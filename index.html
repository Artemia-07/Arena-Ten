<style>
:root{
  --bg-deep:#0a1628;
  --bg-mid:#122338;
  --panel:rgba(18,35,56,0.92);
  --panel-light:rgba(26,48,76,0.75);
  --line:rgba(212,175,55,0.22);
  --line-strong:rgba(212,175,55,0.5);
  --cream:#f2ead8;
  --cream-dim:rgba(242,234,216,0.72);
  --gold:#d4af37;
  --gold-light:#f0cc5a;
  --gold-glow:rgba(212,175,55,0.35);
  --blue-accent:#3d8bfd;
  --purple-accent:#8b6bb8;
  --flag-red:#E4002B;
  --a:#2ecc71;
  --b:#f0cc5a;
  --c:#e67e22;
  --d:#e74c3c;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse 90% 55% at 50% -5%, rgba(61,139,253,0.14), transparent 55%),
    radial-gradient(ellipse 50% 35% at 95% 80%, rgba(139,107,184,0.1), transparent),
    radial-gradient(ellipse 40% 30% at 5% 70%, rgba(212,175,55,0.06), transparent),
    linear-gradient(180deg, var(--bg-deep) 0%, #0f1f35 45%, var(--bg-mid) 100%);
  color:var(--cream);
  font-family:'Nunito Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4af37' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  opacity:0.5;
}
.display{font-family:'Cinzel',serif; text-transform:uppercase; letter-spacing:0.04em;}
.label{font-family:'Nunito Sans',sans-serif; font-size:0.72rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase;}
a{color:inherit; text-decoration:none;}
::selection{background:var(--gold); color:#fff;}

.nav{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 5vw;
  background:linear-gradient(180deg, rgba(18,9,9,0.97), rgba(18,9,9,0.88));
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-strong);
  box-shadow:0 4px 24px rgba(0,0,0,0.35);
}
.nav .logo{display:flex; align-items:center; gap:12px; font-size:1.05rem;}
.nav .logo .shield{
  width:28px; height:32px; flex-shrink:0;
  background:linear-gradient(180deg, var(--gold-light), var(--gold) 45%, #9a7b1a);
  clip-path:polygon(50% 0%, 92% 16%, 92% 58%, 50% 100%, 8% 58%, 8% 16%);
  box-shadow:0 0 14px var(--gold-glow);
  position:relative;
  border:1px solid rgba(0,0,0,0.25);
}
.nav .logo .shield::after{
  content:"10"; position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-family:'Cinzel',serif; font-size:0.62rem; font-weight:800; color:#1a1208;
  padding-top:4px;
  text-shadow:0 1px 2px rgba(255,255,255,0.4);
}
.nav .logo b{display:block; letter-spacing:0.06em; color:var(--gold-light); text-shadow:0 0 20px var(--gold-glow);}
.nav .logo small{display:block; font-family:'Nunito Sans',sans-serif; text-transform:uppercase; letter-spacing:0.14em; font-size:0.58rem; color:var(--cream-dim); font-weight:700;}
.nav .tag{
  font-family:'Cinzel',serif; font-size:0.72rem; color:var(--gold-light);
  border:1px solid var(--line-strong); padding:7px 16px;
  background:linear-gradient(180deg, rgba(212,175,55,0.12), rgba(212,175,55,0.04));
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.08);
}

main{position:relative; z-index:1; max-width:1120px; margin:0 auto; padding:0 5vw 100px;}

.hero{
  padding:52px 0 36px;
  border-bottom:1px solid var(--line);
  position:relative;
}
.hero::after{
  content:""; position:absolute; bottom:-1px; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity:0.5;
}
.eyebrow{
  font-family:'Cinzel',serif; color:var(--gold); font-size:0.82rem;
  letter-spacing:0.18em; margin-bottom:16px;
}
.hero h1{
  font-size:clamp(2rem,5.5vw,3.8rem); line-height:1.12; margin:0 0 20px;
  color:var(--cream);
  text-shadow:0 2px 24px rgba(212,175,55,0.15);
}
.hero h1 .gold{
  background:linear-gradient(180deg, var(--flag-red) 0%, var(--flag-red) 48%, #ffffff 52%, #ffffff 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.hero p{max-width:660px; color:var(--cream-dim); font-size:1.02rem; line-height:1.7;}
.hero .meta-row{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:14px; margin-top:32px;
}
.meta-item{
  background:var(--panel-light);
  border:1px solid var(--line);
  padding:16px 18px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);
}
.meta-item .label{color:var(--gold); margin-bottom:8px; display:block;}
.meta-item b{color:var(--cream); display:block; font-size:1rem; font-weight:800; line-height:1.3;}

.method{
  display:grid; grid-template-columns:repeat(4,1fr); gap:12px;
  margin:36px 0 0;
}
@media(max-width:760px){.method{grid-template-columns:repeat(2,1fr);}}
.method div{
  background:var(--panel);
  border:1px solid var(--line);
  padding:18px 16px;
  position:relative;
  box-shadow:0 4px 16px rgba(0,0,0,0.2);
}
.method div::before{
  content:""; position:absolute; top:0; left:12px; right:12px; height:2px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity:0.6;
}
.method div span{display:block; font-family:'Cinzel',serif; font-size:0.72rem; color:var(--gold-light); margin-bottom:8px; letter-spacing:0.06em;}
.method div p{margin:0; font-size:0.84rem; color:var(--cream-dim); line-height:1.45;}

.list-head{display:flex; justify-content:center; align-items:center; margin:52px 0 22px;}
.list-head h2{
  font-family:'Cinzel',serif; font-size:0.95rem; margin:0;
  color:var(--cream); font-weight:700; letter-spacing:0.12em;
  padding:0 24px; position:relative; text-align:center;
}
.list-head h2::before,.list-head h2::after{
  content:"✦"; color:var(--gold); opacity:0.7; margin:0 10px;
}

.row{
  display:grid;
  grid-template-columns: 62px 1fr auto auto;
  align-items:center;
  gap:18px;
  padding:18px 20px;
  margin-bottom:10px;
  background:var(--panel);
  border:1px solid var(--line);
  cursor:pointer;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
  position:relative;
  box-shadow:0 2px 12px rgba(0,0,0,0.15);
}
.row:hover{
  border-color:var(--line-strong);
  box-shadow:0 4px 24px rgba(0,0,0,0.25), 0 0 20px color-mix(in srgb, var(--team, var(--gold)) 15%, transparent);
  transform:translateY(-1px);
}
.row::before{
  content:""; position:absolute; left:0; top:8px; bottom:8px; width:4px;
  background:linear-gradient(180deg, var(--team, var(--gold)), color-mix(in srgb, var(--team, var(--gold)) 40%, transparent));
  border-radius:0 2px 2px 0;
  opacity:0.85;
}
.rank-badge{
  width:48px; height:54px;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(180deg, rgba(35,20,20,0.95), rgba(18,10,10,0.98));
  border:2px solid var(--team, var(--gold));
  clip-path:polygon(50% 0%, 100% 15%, 100% 70%, 50% 100%, 0% 70%, 0% 15%);
  box-shadow:0 0 14px color-mix(in srgb, var(--team, var(--gold)) 25%, transparent);
}
.rank-badge span{
  font-family:'Cinzel',serif; font-size:1.15rem; font-weight:800;
  color:var(--team, var(--gold-light));
  text-shadow:0 0 8px color-mix(in srgb, var(--team, var(--gold)) 40%, transparent);
  margin-top:-2px;
}
.row-name h3{margin:0 0 4px; font-size:1.15rem; font-weight:800; color:var(--cream);}
.row-name .sub{font-size:0.78rem; color:var(--cream-dim); font-weight:600;}
.row-hook{display:none;}
@media(min-width:760px){ .row-hook{display:block; max-width:280px; font-size:0.82rem; color:var(--cream-dim); line-height:1.45;} }
.grade-pill{
  font-family:'Cinzel',serif; font-size:0.95rem; font-weight:800;
  min-width:44px; height:44px; padding:0 6px;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(180deg, rgba(30,17,17,0.9), rgba(15,8,8,0.95));
  border:2px solid var(--grade-color,var(--b));
  color:var(--grade-color,var(--b));
  flex-shrink:0;
  clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  box-shadow:0 0 10px color-mix(in srgb, var(--grade-color,var(--b)) 20%, transparent);
}

.hm-section{margin-top:56px;}
.hm-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px; margin-top:18px;}
.hm-card{
  background:var(--panel);
  border:1px solid var(--line);
  padding:24px 22px;
  border-top:3px solid var(--team,var(--gold));
  box-shadow:0 4px 20px rgba(0,0,0,0.2);
  position:relative;
}
.hm-card::before{
  content:""; position:absolute; top:12px; right:14px;
  width:20px; height:24px; opacity:0.15;
  background:var(--team,var(--gold));
  clip-path:polygon(50% 0%, 100% 18%, 100% 72%, 50% 100%, 0% 72%, 0% 18%);
}
.hm-card .tag{font-size:0.68rem; color:var(--gold); margin-bottom:8px; display:block;}
.hm-card h4{margin:0 0 6px; font-size:1.15rem; font-family:'Cinzel',serif; color:var(--cream);}
.hm-card .sub{font-size:0.76rem; color:var(--cream-dim); margin-bottom:12px; font-weight:600;}
.hm-card p{margin:0; font-size:0.87rem; color:var(--cream-dim); line-height:1.6;}
.hm-card .hm-label{font-size:0.66rem; color:var(--gold-light); margin-top:18px; margin-bottom:8px;}
.hm-card ul{margin:0; padding:0 0 0 18px; font-size:0.84rem; color:var(--cream-dim); line-height:1.55;}
.hm-card ul li{margin-bottom:5px;}
.hm-card ul li::marker{color:var(--gold);}

.site-footer{
  margin-top:80px; padding-top:28px;
  border-top:1px solid var(--line);
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px;
  color:var(--cream-dim); font-size:0.78rem;
}

.back-link{
  display:inline-flex; align-items:center; gap:8px; margin:32px 0 0;
  font-size:0.82rem; color:var(--gold); font-weight:700; letter-spacing:0.04em;
}
.back-link:hover{color:var(--gold-light);}

.p-hero{
  position:relative;
  margin-top:22px;
  padding:44px 32px 40px;
  border:1px solid var(--line-strong);
  overflow:hidden;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--team,var(--gold)) 35%, #120909) 0%, rgba(18,9,9,0.95) 55%, #170d0d 100%);
  box-shadow:0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
}
.p-hero::before{
  content:""; position:absolute; inset:8px;
  border:1px solid rgba(212,175,55,0.15); pointer-events:none;
}
.p-hero .watermark{
  position:absolute; right:-0.02em; top:-0.2em;
  font-family:'Cinzel',serif; font-size:12rem; font-weight:800;
  color:rgba(212,175,55,0.06);
  line-height:1; pointer-events:none; user-select:none;
}
.p-hero .rank-tag{
  font-family:'Cinzel',serif; font-size:0.78rem; letter-spacing:0.1em;
  background:linear-gradient(180deg, rgba(212,175,55,0.2), rgba(212,175,55,0.08));
  border:1px solid var(--line-strong); padding:7px 16px;
  display:inline-block; margin-bottom:18px; color:var(--gold-light);
}
.p-hero h1{
  font-family:'Cinzel',serif;
  font-size:clamp(2rem,5vw,3.4rem); margin:0 0 8px; position:relative;
  color:var(--cream); text-shadow:0 2px 20px rgba(0,0,0,0.4);
}
.p-hero .team-line{color:var(--cream-dim); font-size:0.92rem; margin-bottom:20px; font-weight:700; letter-spacing:0.04em;}
.p-hero .hook{max-width:640px; font-size:1.02rem; line-height:1.65; color:var(--cream-dim); position:relative;}

.report-card{
  display:grid; grid-template-columns:repeat(4,1fr); gap:0;
  border:1px solid var(--line); border-top:none;
  overflow:hidden;
  background:var(--panel);
}
.report-card .cell{
  background:rgba(18,9,9,0.85);
  padding:22px 14px; text-align:center;
  border-right:1px solid var(--line);
}
.report-card .cell:last-child{border-right:none;}
.report-card .cell .label{font-size:0.62rem; color:var(--cream-dim); margin-bottom:10px;}
.report-card .cell .grade{font-family:'Cinzel',serif; font-size:2rem; font-weight:800; color:var(--grade-color);}
@media(max-width:640px){
  .report-card{grid-template-columns:repeat(2,1fr);}
  .report-card .cell:nth-child(2){border-right:none;}
  .report-card .cell:nth-child(1),.report-card .cell:nth-child(2){border-bottom:1px solid var(--line);}
}

.section-title{
  font-family:'Cinzel',serif; color:var(--gold-light); font-size:0.82rem;
  letter-spacing:0.14em; margin:48px 0 18px;
  display:flex; align-items:center; gap:14px; font-weight:700;
}
.section-title::before,.section-title::after{
  content:""; flex:1; height:1px;
  background:linear-gradient(90deg, transparent, var(--line-strong), transparent);
}

.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px;}
.stat-box{
  background:var(--panel); border:1px solid var(--line); padding:20px 16px;
  text-align:center; box-shadow:0 2px 12px rgba(0,0,0,0.15);
  position:relative;
}
.stat-box::before{
  content:""; position:absolute; top:0; left:20%; right:20%; height:2px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent); opacity:0.5;
}
.stat-box .v{font-family:'Cinzel',serif; font-size:1.65rem; font-weight:800; color:var(--gold-light);}
.stat-box .k{font-size:0.68rem; color:var(--cream-dim); margin-top:6px; font-weight:600; letter-spacing:0.04em;}

.bar-row{display:grid; grid-template-columns:130px 1fr 50px; align-items:center; gap:14px; margin-bottom:16px;}
.bar-row .lbl{font-size:0.82rem; color:var(--cream-dim); font-weight:600;}
.bar-track{
  height:12px; background:rgba(18,9,9,0.8); overflow:hidden;
  border:1px solid var(--line); border-radius:2px;
  box-shadow:inset 0 2px 4px rgba(0,0,0,0.3);
}
.bar-fill{
  height:100%;
  background:linear-gradient(90deg, color-mix(in srgb, var(--team,var(--gold)) 70%, #000), var(--team,var(--gold)));
  box-shadow:0 0 8px color-mix(in srgb, var(--team,var(--gold)) 40%, transparent);
}
.bar-row .pct{font-size:0.76rem; color:var(--gold-light); text-align:right; font-weight:700;}

.prose p{line-height:1.75; color:var(--cream-dim); font-size:0.98rem; margin:0 0 18px;}
.prose strong{color:var(--cream); font-weight:700;}
.achv-list{list-style:none; margin:0; padding:0; display:grid; gap:10px;}
.achv-list li{
  display:flex; gap:12px; align-items:flex-start;
  font-size:0.93rem; color:var(--cream-dim); line-height:1.55;
  padding:12px 14px; background:var(--panel-light); border:1px solid var(--line);
}
.achv-list li::before{content:"⚔"; color:var(--gold); flex-shrink:0; font-size:0.85rem;}

.pager{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:60px;}
.pager a{
  border:1px solid var(--line); padding:20px 22px; display:block;
  background:var(--panel);
  transition:border-color .2s, box-shadow .2s;
}
.pager a:hover{border-color:var(--line-strong); box-shadow:0 4px 20px rgba(0,0,0,0.25);}
.pager .dir{font-size:0.68rem; color:var(--gold); margin-bottom:6px; font-weight:700; letter-spacing:0.08em;}
.pager .nm{font-weight:800; font-size:1.05rem; font-family:'Cinzel',serif; color:var(--cream);}
.pager .next{text-align:right;}
@media(max-width:600px){.pager{grid-template-columns:1fr;}}

@media (prefers-reduced-motion: reduce){ *{transition:none !important; scroll-behavior:auto !important;} }
</style>
</head>

const GRADE_COLOR = g => {
  if(!g) return "var(--b)";
  const l = g[0];
  if(l==="A") return "var(--a)";
  if(l==="B") return "var(--b)";
  if(l==="C") return "var(--c)";
  return "var(--d)";
};

      </div>
      <div class="row-hook">${p.hook}</div>

function renderPlayer(slug){
  const list = PLAYERS.slice().sort((a,b)=>a.rank-b.rank);
  const idx = list.findIndex(p=>p.slug===slug);
  if(idx===-1) return `<div style="padding:80px 0;">Player not found. <a href="#/" style="color:var(--gold);">Back to the ranking →</a></div>`;
  const p = list[idx];
  const prev = list[(idx-1+list.length)%list.length];
  const next = list[(idx+1)%list.length];

  const bars = p.stats.map(([label,pct])=>`
    <div class="bar-row">
      <div class="lbl">${label}</div>
      <div class="bar-track"><div class="bar-fill" style="--team:${p.color}; width:${pct};"></div></div>
      <div class="pct">${pct}</div>
    </div>
  `).join("");

  const boxes = p.statBoxes.map(([v,k])=>`
    <div class="stat-box"><div class="v">${v}</div><div class="k">${k}</div></div>
  `).join("");

  const narrative = p.narrative.map(par=>`<p>${par}</p>`).join("");
  const achv = p.achievements.map(a=>`<li>${a}</li>`).join("");
  const cells = ["domestic","international","longevity","individual"].map(key=>{
    const label = {domestic:"Domestic Titles",international:"International",longevity:"Longevity",individual:"Individual"}[key];
    const g = p.grades[key];
    return `<div class="cell" style="--grade-color:${GRADE_COLOR(g)}"><div class="label">${label}</div><div class="grade">${g}</div></div>`;
  }).join("");

  return `
    <a href="#/" class="back-link">← BACK TO THE RANKING</a>
    <div class="p-hero" style="--team:${p.color}">
      <div class="watermark">${p.rank}</div>
      <div class="rank-tag">Rank #${p.rank} of 10</div>
      <h1>${p.name}</h1>
      <div class="team-line mono">${p.team} · ${p.pos}</div>
      <div class="hook">${p.hook}</div>
    </div>
    <div class="report-card">${cells}</div>

    <div class="section-title">CAREER SNAPSHOT</div>
    <div class="stat-grid">${boxes}</div>

    <div class="section-title">SCOUTING BREAKDOWN</div>
    ${bars}

    <div class="section-title">THE FULL REPORT</div>
    <div class="prose">${narrative}</div>

    <div class="section-title">TITLES &amp; ACHIEVEMENTS</div>
    <ul class="achv-list">${achv}</ul>

    <div class="pager">
      <a href="#/player/${prev.slug}"><div class="dir">← Previous · #${prev.rank}</div><div class="nm">${prev.name}</div></a>
      <a href="#/player/${next.slug}" class="next"><div class="dir">Next · #${next.rank} →</div><div class="nm">${next.name}</div></a>
    </div>
    <footer class="site-footer">
      <div>Arena Ten — independent all-time MPL Indonesia analysis &amp; grading.</div>
      <div>Grades reflect editorial judgment based on sourced achievements, not official league scoring.</div>
    </footer>
  `;
}

function router(){
  const hash = location.hash || "#/";
  const app = document.getElementById("app");
  const playerMatch = hash.match(/^#\/player\/([a-z0-9-]+)/);
  if(playerMatch){
    app.innerHTML = renderPlayer(playerMatch[1]);
  } else {
    app.innerHTML = renderHome();
  }
  window.scrollTo({top:0, behavior:"instant"});
}
window.addEventListener("hashchange", router);
window.addEventListener("DOMContentLoaded", router);
</script>
