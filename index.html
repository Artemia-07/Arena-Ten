  --chalk:#EAF4FF;
  --chalk-dim: rgba(234,244,255,0.60);
  --cyan:#22E5D8;
  --violet:#B14EFF;
  --flare:#FF3D81;
  --a:#22E5D8;

  --c:#FFB020;
  --d:#FF4D6D;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{

  color:var(--chalk);
  font-family:'Inter',sans-serif;

}

a{color:inherit; text-decoration:none;}

.hero{padding:64px 0 40px; border-bottom:1px solid var(--line-soft);}

@media (prefers-reduced-motion: reduce){ *{transition:none !important; scroll-behavior:auto !important;} }

const GRADE_COLOR = g => {
  if(!g) return "var(--b)";
  const l = g[0];
  if(l==="A") return "var(--a)";
  if(l==="B") return "var(--b)";
  if(l==="C") return "var(--c)";
  return "var(--d)";
};

function renderHome(){
  const rows = PLAYERS.slice().sort((a,b)=>a.rank-b.rank).map(p=>`
    <a href="#/player/${p.slug}" class="row" style="--team:${p.color}">
      <div class="rank-hex">${p.rank}</div>
      <div class="row-name">
        <h3>${p.name}</h3>
        <div class="sub">${p.team} · ${p.pos}</div>
      </div>
      <div class="row-hook">${p.hook}</div>
      <div class="grade-pill" style="--grade-color:${GRADE_COLOR(p.grades.overall)}">${p.grades.overall}</div>
    </a>
  `).join("");

  const hmCards = HONORABLE_MENTIONS.map(h=>`
    <div class="hm-card" style="--team:${h.color}">
      <span class="tag mono">${h.tag}</span>
      <h4>${h.name}</h4>
      <div class="sub">${h.team}</div>
      <p>${h.text}</p>
    </div>
  `).join("");

  return `
    <section class="hero">
      <div class="eyebrow">// MPL INDONESIA · ALL-TIME RANKING</div>
      <h1>TOP 10 <span class="glow">MPL ID</span><br>PLAYERS OF ALL TIME</h1>
      <p>A ranked, graded breakdown of the ten greatest players in MPL Indonesia history — weighted across domestic titles, international results, career longevity, and individual awards. Built from Seasons 1 through 17, plus every M-Series and MSC appearance along the way.</p>
      <div class="meta-row">
        <div class="meta-item">MOST TITLES<b>Kiboy (7)</b></div>
        <div class="meta-item">ONLY WORLD CHAMPION<b>EVOS Legends (M1 '19)</b></div>
        <div class="meta-item">MOST DECORATED ORG<b>ONIC Esports (8 titles)</b></div>
        <div class="meta-item">S17 CHAMPION<b>Bigetron by Vitality</b></div>
      </div>
      <div class="method">
        <div><span>DOMESTIC TITLES</span><p>MPL Indonesia championships and Finals appearances.</p></div>
        <div><span>INTERNATIONAL RESULTS</span><p>M-Series, MSC, and other world-stage performances.</p></div>
        <div><span>LONGEVITY</span><p>Career length and sustained relevance across eras.</p></div>
        <div><span>INDIVIDUAL AWARDS</span><p>MVPs, Finals MVPs, and individual hardware earned.</p></div>
      </div>
    </section>
    <div class="list-head">
      <h2 class="mono">THE RANKING — TAP ANY PLAYER FOR THE FULL REPORT</h2>
    </div>
    <div class="list">${rows}</div>
    <div class="hm-section">
      <div class="section-title">HONORABLE MENTIONS</div>
      <div class="hm-grid">${hmCards}</div>
    </div>
    <footer class="site-footer">
      <div>Arena Ten — independent all-time MPL Indonesia analysis &amp; grading.</div>
      <div>Grades reflect editorial judgment based on sourced achievements, not official league scoring.</div>
    </footer>
  `;
}

function renderPlayer(slug){
  const list = PLAYERS.slice().sort((a,b)=>a.rank-b.rank);
  const idx = list.findIndex(p=>p.slug===slug);
  if(idx===-1) return `<div style="padding:80px 0;">Player not found. <a href="#/" class="mono" style="color:var(--cyan);">Back to the ranking →</a></div>`;
  const p = list[idx];
  const prev = list[(idx-1+list.length)%list.length];
  const next = list[(idx+1)%list.length];

  const bars = p.stats.map(([label,pct])=>`
    <div class="bar-row">
      <div class="lbl">${label}</div>
      <div class="bar-track"><div class="bar-fill" style="--team:${p.color}; width:${pct};"></div></div>
      <div class="pct">${pct}</div>
    </div>
  `).join("");

  const boxes = p.statBoxes.map(([v,k])=>`
    <div class="stat-box"><div class="v">${v}</div><div class="k">${k}</div></div>
  `).join("");

  const narrative = p.narrative.map(par=>`<p>${par}</p>`).join("");
  const achv = p.achievements.map(a=>`<li>${a}</li>`).join("");
  const cells = ["domestic","international","longevity","individual"].map(key=>{
    const label = {domestic:"Domestic Titles",international:"International",longevity:"Longevity",individual:"Individual"}[key];
    const g = p.grades[key];
    return `<div class="cell" style="--grade-color:${GRADE_COLOR(g)}"><div class="label">${label}</div><div class="grade">${g}</div></div>`;
  }).join("");

  return `
    <a href="#/" class="back-link">← BACK TO THE RANKING</a>
    <div class="p-hero" style="--team:${p.color}">
      <div class="watermark">${p.rank}</div>
      <div class="rank-tag mono">RANK #${p.rank} OF 10</div>
      <h1>${p.name}</h1>
      <div class="team-line mono">${p.team} · ${p.pos}</div>
      <div class="hook">${p.hook}</div>
    </div>
    <div class="report-card">${cells}</div>

    <div class="section-title">CAREER SNAPSHOT</div>
    <div class="stat-grid">${boxes}</div>

    <div class="section-title">SCOUTING BREAKDOWN</div>
    ${bars}

    <div class="section-title">THE FULL REPORT</div>
    <div class="prose">${narrative}</div>

    <div class="section-title">TITLES &amp; ACHIEVEMENTS</div>
    <ul class="achv-list">${achv}</ul>

    <div class="pager">
      <a href="#/player/${prev.slug}"><div class="dir mono">← PREVIOUS · #${prev.rank}</div><div class="nm">${prev.name}</div></a>
      <a href="#/player/${next.slug}" class="next"><div class="dir mono">NEXT · #${next.rank} →</div><div class="nm">${next.name}</div></a>
    </div>
    <footer class="site-footer">
      <div>Arena Ten — independent all-time MPL Indonesia analysis &amp; grading.</div>
      <div>Grades reflect editorial judgment based on sourced achievements, not official league scoring.</div>
    </footer>
  `;
}

function router(){
  const hash = location.hash || "#/";
  const app = document.getElementById("app");
  const playerMatch = hash.match(/^#\/player\/([a-z0-9-]+)/);
  if(playerMatch){
    app.innerHTML = renderPlayer(playerMatch[1]);
  } else {
    app.innerHTML = renderHome();
  }
  window.scrollTo({top:0, behavior:"instant"});
}
window.addEventListener("hashchange", router);
window.addEventListener("DOMContentLoaded", router);
</script>
