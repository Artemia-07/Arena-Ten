<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 10 Indonesian Mobile Legends Players of All Time | Arena Ten</title>
<meta name="description" content="A ranked, graded breakdown of the greatest Indonesian Mobile Legends: Bang Bang players ever — built from domestic titles, international results, longevity, and individual awards.">
<meta property="og:title" content="Top 10 Indonesian Mobile Legends Players of All Time | Arena Ten">
<meta property="og:description" content="The definitive, sourced ranking of Indonesia's all-time Mobile Legends greats — Kairi, Kiboy, Sanz, Lemon, and the legends of EVOS's M1 World Championship run.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0a1628;
  --bg-mid:#122338;
  --panel:rgba(18,35,56,0.92);
  --panel-light:rgba(26,48,76,0.75);
  --line:rgba(212,175,55,0.22);
  --line-strong:rgba(212,175,55,0.5);
  --cream:#f2ead8;
  --cream-dim:rgba(242,234,216,0.72);
  --gold:#d4af37;
  --gold-light:#f0cc5a;
  --gold-glow:rgba(212,175,55,0.35);
  --blue-accent:#3d8bfd;
  --purple-accent:#8b6bb8;
  --flag-red:#E4002B;
  --a:#2ecc71;
  --b:#f0cc5a;
  --c:#e67e22;
  --d:#e74c3c;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse 90% 55% at 50% -5%, rgba(61,139,253,0.14), transparent 55%),
    radial-gradient(ellipse 50% 35% at 95% 80%, rgba(139,107,184,0.1), transparent),
    radial-gradient(ellipse 40% 30% at 5% 70%, rgba(212,175,55,0.06), transparent),
    linear-gradient(180deg, var(--bg-deep) 0%, #0f1f35 45%, var(--bg-mid) 100%);
  color:var(--cream);
  font-family:'Nunito Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4af37' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  opacity:0.5;
}
.display{font-family:'Cinzel',serif; text-transform:uppercase; letter-spacing:0.04em;}
.label{font-family:'Nunito Sans',sans-serif; font-size:0.72rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase;}
a{color:inherit; text-decoration:none;}
::selection{background:var(--gold); color:#fff;}

/* ===== SIDEBAR (persistent, stays put on scroll) ===== */
.sidebar{
  position:fixed; top:0; left:0; bottom:0; width:248px; z-index:60;
  display:flex; flex-direction:column;
  background:linear-gradient(180deg, rgba(18,9,9,0.98), rgba(10,22,40,0.97));
  border-right:1px solid var(--line-strong);
  box-shadow:4px 0 28px rgba(0,0,0,0.35);
  overflow-y:auto;
  transition:transform .25s ease;
}
.sidebar .logo{display:flex; align-items:center; gap:12px; font-size:1.02rem; padding:22px 20px 18px;}
.sidebar .logo .shield{
  width:28px; height:32px; flex-shrink:0;
  background:linear-gradient(180deg, var(--gold-light), var(--gold) 45%, #9a7b1a);
  clip-path:polygon(50% 0%, 92% 16%, 92% 58%, 50% 100%, 8% 58%, 8% 16%);
  box-shadow:0 0 14px var(--gold-glow);
  position:relative;
  border:1px solid rgba(0,0,0,0.25);
}
.sidebar .logo .shield::after{
  content:"10"; position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-family:'Cinzel',serif; font-size:0.62rem; font-weight:800; color:#1a1208;
  padding-top:4px;
  text-shadow:0 1px 2px rgba(255,255,255,0.4);
}
.sidebar .logo b{display:block; letter-spacing:0.06em; color:var(--gold-light); text-shadow:0 0 20px var(--gold-glow); font-size:1rem;}
.sidebar .logo small{display:block; font-family:'Nunito Sans',sans-serif; text-transform:uppercase; letter-spacing:0.14em; font-size:0.54rem; color:var(--cream-dim); font-weight:700;}
.sidebar .tag{
  margin:0 20px 18px;
  font-family:'Cinzel',serif; font-size:0.66rem; color:var(--gold-light);
  border:1px solid var(--line-strong); padding:6px 14px; text-align:center;
  background:linear-gradient(180deg, rgba(212,175,55,0.12), rgba(212,175,55,0.04));
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.08);
}
.sidebar-links{display:flex; flex-direction:column; padding:6px 12px; gap:2px; flex:1;}
.sidebar-links a{
  display:flex; align-items:center; gap:12px;
  padding:12px 14px; border-radius:3px;
  font-family:'Cinzel',serif; font-size:0.82rem; letter-spacing:0.05em;
  color:var(--cream-dim); font-weight:600;
  border-left:2px solid transparent;
  transition:background .15s, color .15s, border-color .15s;
}
.sidebar-links a .ic{width:16px; text-align:center; opacity:0.85; flex-shrink:0;}
.sidebar-links a:hover{background:rgba(212,175,55,0.08); color:var(--cream);}
.sidebar-links a.active{
  color:var(--gold-light); background:rgba(212,175,55,0.1);
  border-left-color:var(--gold);
}
.sidebar-foot{padding:16px 20px 22px; font-size:0.66rem; color:var(--cream-dim); border-top:1px solid var(--line); line-height:1.5;}

.mobile-topbar{display:none;}
.sidebar-backdrop{display:none;}

/* Desktop-persistent collapse toggle (always available) */
.sidebar-edge-toggle{
  position:fixed; top:26px; left:248px; z-index:65;
  width:22px; height:44px;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(180deg, rgba(212,175,55,0.16), rgba(212,175,55,0.05));
  border:1px solid var(--line-strong); border-left:none;
  color:var(--gold-light); font-size:0.78rem; cursor:pointer;
  transition:left .25s ease, background .15s;
}
.sidebar-edge-toggle:hover{background:rgba(212,175,55,0.24);}
body.sidebar-collapsed .sidebar{transform:translateX(-100%);}
body.sidebar-collapsed .sidebar-edge-toggle{left:0;}
body.sidebar-collapsed main{margin-left:0 !important;}
@media(max-width:900px){ .sidebar-edge-toggle{display:none;} }

/* Floating back-to-top control */
.back-to-top{
  position:fixed; right:28px; bottom:28px; z-index:58;
  width:48px; height:48px; border-radius:50%;
  background:linear-gradient(180deg, var(--gold-light), var(--gold));
  color:#1a1208; border:1px solid var(--gold); font-size:1.3rem; font-weight:800; line-height:1;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,0.4);
  opacity:0; pointer-events:none; transform:translateY(12px);
  transition:opacity .2s ease, transform .2s ease, box-shadow .2s ease;
}
.back-to-top.show{opacity:1; pointer-events:auto; transform:translateY(0);}
.back-to-top:hover{box-shadow:0 0 20px var(--gold-glow);}
@media(max-width:900px){ .back-to-top{right:18px; bottom:18px; width:44px; height:44px; font-size:1.15rem;} }

@media(max-width:900px){
  .sidebar{
    transform:translateX(-100%);
    width:250px;
  }
  .sidebar.open{transform:translateX(0); box-shadow:8px 0 40px rgba(0,0,0,0.55);}
  .mobile-topbar{
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:55;
    padding:14px 5vw;
    background:linear-gradient(180deg, rgba(18,9,9,0.97), rgba(18,9,9,0.9));
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-strong);
  }
  .mobile-topbar .logo{display:flex; align-items:center; gap:10px;}
  .mobile-topbar .logo .shield{
    width:24px; height:28px; flex-shrink:0;
    background:linear-gradient(180deg, var(--gold-light), var(--gold) 45%, #9a7b1a);
    clip-path:polygon(50% 0%, 92% 16%, 92% 58%, 50% 100%, 8% 58%, 8% 16%);
    box-shadow:0 0 14px var(--gold-glow);
    border:1px solid rgba(0,0,0,0.25);
  }
  .mobile-topbar .logo b{font-family:'Cinzel',serif; font-size:0.92rem; letter-spacing:0.05em; color:var(--gold-light);}
  .menu-btn{
    width:38px; height:34px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    background:rgba(212,175,55,0.08); border:1px solid var(--line-strong); cursor:pointer;
  }
  .menu-btn span{width:18px; height:2px; background:var(--gold-light); display:block;}
  .sidebar-backdrop.show{
    display:block; position:fixed; inset:0; z-index:59;
    background:rgba(4,8,14,0.6); backdrop-filter:blur(2px);
  }
  main{margin-left:0 !important;}
}

main{position:relative; z-index:1; max-width:1120px; margin:0 auto 0 248px; padding:44px 5vw 100px; min-height:100vh; transition:margin-left .25s ease;}
@media(max-width:900px){ main{padding:36px 5vw 100px;} }

.hero{
  padding:52px 0 36px;
  border-bottom:1px solid var(--line);
  position:relative;
}
.hero::after{
  content:""; position:absolute; bottom:-1px; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity:0.5;
}
.eyebrow{
  font-family:'Cinzel',serif; color:var(--gold); font-size:0.82rem;
  letter-spacing:0.18em; margin-bottom:16px;
}
.hero h1{
  font-size:clamp(2rem,5.5vw,3.8rem); line-height:1.12; margin:0 0 20px;
  color:var(--cream);
  text-shadow:0 2px 24px rgba(212,175,55,0.15);
}
.hero h1 .gold{
  background:linear-gradient(180deg, var(--flag-red) 0%, var(--flag-red) 48%, #ffffff 52%, #ffffff 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.hero p{max-width:660px; color:var(--cream-dim); font-size:1.02rem; line-height:1.7;}
.hero .meta-row{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:14px; margin-top:32px;
}
.meta-item{
  background:var(--panel-light);
  border:1px solid var(--line);
  padding:16px 18px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);
}
.meta-item .label{color:var(--gold); margin-bottom:8px; display:block;}
.meta-item b{color:var(--cream); display:block; font-size:1rem; font-weight:800; line-height:1.3;}

.method{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px;
  margin:36px 0 0;
}
@media(max-width:760px){.method{grid-template-columns:repeat(2,1fr);}}
.method div{
  background:var(--panel);
  border:1px solid var(--line);
  padding:18px 16px;
  position:relative;
  box-shadow:0 4px 16px rgba(0,0,0,0.2);
}
.method div::before{
  content:""; position:absolute; top:0; left:12px; right:12px; height:2px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity:0.6;
}
.method div span{display:block; font-family:'Cinzel',serif; font-size:0.72rem; color:var(--gold-light); margin-bottom:8px; letter-spacing:0.06em;}
.method div p{margin:0; font-size:0.84rem; color:var(--cream-dim); line-height:1.45;}

.list-head{display:flex; justify-content:center; align-items:center; margin:52px 0 22px;}
.list-head h2{
  font-family:'Cinzel',serif; font-size:0.95rem; margin:0;
  color:var(--cream); font-weight:700; letter-spacing:0.12em;
  padding:0 24px; position:relative; text-align:center;
}
.list-head h2::before,.list-head h2::after{
  content:"✦"; color:var(--gold); opacity:0.7; margin:0 10px;
}

.row{
  display:grid;
  grid-template-columns: 62px 1fr auto auto;
  align-items:center;
  gap:18px;
  padding:18px 20px;
  margin-bottom:10px;
  background:var(--panel);
  border:1px solid var(--line);
  cursor:pointer;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
  position:relative;
  box-shadow:0 2px 12px rgba(0,0,0,0.15);
}
.row:hover{
  border-color:var(--line-strong);
  box-shadow:0 4px 24px rgba(0,0,0,0.25), 0 0 20px color-mix(in srgb, var(--team, var(--gold)) 15%, transparent);
  transform:translateY(-1px);
}
.row::before{
  content:""; position:absolute; left:0; top:8px; bottom:8px; width:4px;
  background:linear-gradient(180deg, var(--team, var(--gold)), color-mix(in srgb, var(--team, var(--gold)) 40%, transparent));
  border-radius:0 2px 2px 0;
  opacity:0.85;
}
.rank-badge{
  width:48px; height:54px;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(180deg, rgba(35,20,20,0.95), rgba(18,10,10,0.98));
  border:2px solid var(--team, var(--gold));
  clip-path:polygon(50% 0%, 100% 15%, 100% 70%, 50% 100%, 0% 70%, 0% 15%);
  box-shadow:0 0 14px color-mix(in srgb, var(--team, var(--gold)) 25%, transparent);
}
.rank-badge span{
  font-family:'Cinzel',serif; font-size:1.15rem; font-weight:800;
  color:var(--team, var(--gold-light));
  text-shadow:0 0 8px color-mix(in srgb, var(--team, var(--gold)) 40%, transparent);
  margin-top:-2px;
}
.row-name h3{margin:0 0 4px; font-size:1.15rem; font-weight:800; color:var(--cream);}
.row-name .sub{font-size:0.78rem; color:var(--cream-dim); font-weight:600;}
.row-hook{display:none;}
@media(min-width:760px){ .row-hook{display:block; max-width:280px; font-size:0.82rem; color:var(--cream-dim); line-height:1.45;} }
.grade-pill{
  font-family:'Cinzel',serif; font-size:0.95rem; font-weight:800;
  min-width:44px; height:44px; padding:0 6px;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(180deg, rgba(30,17,17,0.9), rgba(15,8,8,0.95));
  border:2px solid var(--grade-color,var(--b));
  color:var(--grade-color,var(--b));
  flex-shrink:0;
  clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  box-shadow:0 0 10px color-mix(in srgb, var(--grade-color,var(--b)) 20%, transparent);
}

.hm-section{margin-top:56px;}
.hm-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px; margin-top:18px;}
.hm-card{
  background:var(--panel);
  border:1px solid var(--line);
  padding:24px 22px;
  border-top:3px solid var(--team,var(--gold));
  box-shadow:0 4px 20px rgba(0,0,0,0.2);
  position:relative;
}
.hm-card::before{
  content:""; position:absolute; top:12px; right:14px;
  width:20px; height:24px; opacity:0.15;
  background:var(--team,var(--gold));
  clip-path:polygon(50% 0%, 100% 18%, 100% 72%, 50% 100%, 0% 72%, 0% 18%);
}
.hm-card .tag{font-size:0.68rem; color:var(--gold); margin-bottom:8px; display:block;}
.hm-card h4{margin:0 0 6px; font-size:1.15rem; font-family:'Cinzel',serif; color:var(--cream);}
.hm-card .sub{font-size:0.76rem; color:var(--cream-dim); margin-bottom:12px; font-weight:600;}
.hm-card p{margin:0; font-size:0.87rem; color:var(--cream-dim); line-height:1.6;}
.hm-card .hm-label{font-size:0.66rem; color:var(--gold-light); margin-top:18px; margin-bottom:8px;}
.hm-card ul{margin:0; padding:0 0 0 18px; font-size:0.84rem; color:var(--cream-dim); line-height:1.55;}
.hm-card ul li{margin-bottom:5px;}
.hm-card ul li::marker{color:var(--gold);}

.site-footer{
  margin-top:80px; padding-top:28px;
  border-top:1px solid var(--line);
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px;
  color:var(--cream-dim); font-size:0.78rem;
}

.back-link{
  display:inline-flex; align-items:center; gap:8px; margin:32px 0 0;
  font-size:0.82rem; color:var(--gold); font-weight:700; letter-spacing:0.04em;
}
.back-link:hover{color:var(--gold-light);}

.p-hero{
  position:relative;
  margin-top:22px;
  padding:44px 32px 40px;
  border:1px solid var(--line-strong);
  overflow:hidden;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--team,var(--gold)) 35%, #120909) 0%, rgba(18,9,9,0.95) 55%, #170d0d 100%);
  box-shadow:0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
}
.p-hero::before{
  content:""; position:absolute; inset:8px;
  border:1px solid rgba(212,175,55,0.15); pointer-events:none;
}
.p-hero .watermark{
  position:absolute; right:-0.02em; top:-0.2em;
  font-family:'Cinzel',serif; font-size:12rem; font-weight:800;
  color:rgba(212,175,55,0.06);
  line-height:1; pointer-events:none; user-select:none;
}
.p-hero .rank-tag{
  font-family:'Cinzel',serif; font-size:0.78rem; letter-spacing:0.1em;
  background:linear-gradient(180deg, rgba(212,175,55,0.2), rgba(212,175,55,0.08));
  border:1px solid var(--line-strong); padding:7px 16px;
  display:inline-block; margin-bottom:18px; color:var(--gold-light);
}
.p-hero h1{
  font-family:'Cinzel',serif;
  font-size:clamp(2rem,5vw,3.4rem); margin:0 0 8px; position:relative;
  color:var(--cream); text-shadow:0 2px 20px rgba(0,0,0,0.4);
}
.p-hero .team-line{color:var(--cream-dim); font-size:0.92rem; margin-bottom:20px; font-weight:700; letter-spacing:0.04em;}
.p-hero .hook{max-width:640px; font-size:1.02rem; line-height:1.65; color:var(--cream-dim); position:relative;}

.report-card{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:0;
  border:1px solid var(--line); border-top:none;
  overflow:hidden;
  background:var(--panel);
}
.report-card .cell{
  background:rgba(18,9,9,0.85);
  padding:22px 14px; text-align:center;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.report-card .cell .label{font-size:0.62rem; color:var(--cream-dim); margin-bottom:10px;}
.report-card .cell .grade{font-family:'Cinzel',serif; font-size:2rem; font-weight:800; color:var(--grade-color);}
@media(max-width:640px){
  .report-card{grid-template-columns:repeat(2,1fr);}
}

.section-title{
  font-family:'Cinzel',serif; color:var(--gold-light); font-size:0.82rem;
  letter-spacing:0.14em; margin:48px 0 18px;
  display:flex; align-items:center; gap:14px; font-weight:700;
}
.section-title::before,.section-title::after{
  content:""; flex:1; height:1px;
  background:linear-gradient(90deg, transparent, var(--line-strong), transparent);
}

.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px;}
.stat-box{
  background:var(--panel); border:1px solid var(--line); padding:20px 16px;
  text-align:center; box-shadow:0 2px 12px rgba(0,0,0,0.15);
  position:relative;
}
.stat-box::before{
  content:""; position:absolute; top:0; left:20%; right:20%; height:2px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent); opacity:0.5;
}
.stat-box .v{font-family:'Cinzel',serif; font-size:1.65rem; font-weight:800; color:var(--gold-light);}
.stat-box .k{font-size:0.68rem; color:var(--cream-dim); margin-top:6px; font-weight:600; letter-spacing:0.04em;}

.bar-row{display:grid; grid-template-columns:130px 1fr 50px; align-items:center; gap:14px; margin-bottom:16px;}
.bar-row .lbl{font-size:0.82rem; color:var(--cream-dim); font-weight:600;}
.bar-track{
  height:12px; background:rgba(18,9,9,0.8); overflow:hidden;
  border:1px solid var(--line); border-radius:2px;
  box-shadow:inset 0 2px 4px rgba(0,0,0,0.3);
}
.bar-fill{
  height:100%;
  background:linear-gradient(90deg, color-mix(in srgb, var(--team,var(--gold)) 70%, #000), var(--team,var(--gold)));
  box-shadow:0 0 8px color-mix(in srgb, var(--team,var(--gold)) 40%, transparent);
}
.bar-row .pct{font-size:0.76rem; color:var(--gold-light); text-align:right; font-weight:700;}

.prose p{line-height:1.75; color:var(--cream-dim); font-size:0.98rem; margin:0 0 18px;}
.prose strong{color:var(--cream); font-weight:700;}
.achv-list{list-style:none; margin:0; padding:0; display:grid; gap:10px;}
.achv-list li{
  display:flex; gap:12px; align-items:flex-start;
  font-size:0.93rem; color:var(--cream-dim); line-height:1.55;
  padding:12px 14px; background:var(--panel-light); border:1px solid var(--line);
}

.pager .next{text-align:right;}

.hub-card h3{font-family:'Cinzel',serif; font-size:1.35rem; margin:0 0 10px; color:var(--cream); line-height:1.3;}
.hub-card p{color:var(--cream-dim); font-size:0.88rem; line-height:1.55; margin:0 0 18px;}
.hub-card .hub-meta{font-size:0.72rem; color:var(--gold); font-weight:700; letter-spacing:0.04em;}
.hub-card.coming-soon{opacity:0.45; cursor:default;}
.hub-card.coming-soon:hover{transform:none; box-shadow:0 4px 16px rgba(0,0,0,0.2); border-color:var(--line);}

/* PLAYER PHOTO */
.player-photo{
  width:64px; height:64px; border-radius:50%; object-fit:cover; flex-shrink:0;
  border:2px solid var(--team,var(--gold)); background:var(--panel-light);
  box-shadow:0 0 12px color-mix(in srgb, var(--team,var(--gold)) 25%, transparent);
}
.player-photo.small{width:44px; height:44px;}
.player-photo-lg{

  box-shadow:0 0 22px color-mix(in srgb, var(--team,var(--gold)) 30%, transparent);

}

const GRADE_COLOR = g => {
  if(!g) return "var(--b)";
  const l = g[0];
  if(l==="A") return "var(--a)";
  if(l==="B") return "var(--b)";
  if(l==="C") return "var(--c)";
  return "var(--d)";
};

function renderPlayerBlock(p, ranking, isLast){
  const bars = p.stats.map(([label,pct])=>`
    <div class="bar-row">
      <div class="lbl">${label}</div>
      <div class="bar-track"><div class="bar-fill" style="--team:${p.color}; width:${pct};"></div></div>
      <div class="pct">${pct}</div>
    </div>
  `).join("");

  const boxes = p.statBoxes.map(([v,k])=>`
    <div class="stat-box"><div class="v">${v}</div><div class="k">${k}</div></div>
  `).join("");

  const narrative = p.narrative.map(par=>`<p>${par}</p>`).join("");
  const achv = p.achievements.map(a=>`<li>${a}</li>`).join("");
  const cells = ranking.criteria.map(([key,label])=>{
    const g = p.grades[key];
    return `<div class="cell" style="--grade-color:${GRADE_COLOR(g)}"><div class="label">${label}</div><div class="grade">${g}</div></div>`;
  }).join("");

  const block = `
    <div id="${p.slug}" class="p-hero" style="--team:${p.color}">
      <div class="watermark">${p.rank}</div>
      <div class="rank-tag">Rank #${p.rank} of 10</div>
      ${playerPhoto(p, "player-photo-lg")}
      <h1>${p.name}</h1>
      <div class="team-line mono">${p.team} · ${p.pos}</div>
      <div class="hook">${p.hook}</div>
    </div>
    <div class="report-card">${cells}</div>

    <div class="section-title">CAREER SNAPSHOT</div>
    <div class="stat-grid">${boxes}</div>

    <div class="section-title">SCOUTING BREAKDOWN</div>
    ${bars}

    <div class="section-title">THE FULL REPORT</div>
    <div class="prose">${narrative}</div>

    <div class="section-title">TITLES &amp; ACHIEVEMENTS</div>
    <ul class="achv-list">${achv}</ul>
  `;

  if(isLast) return block;

  const list = ranking.players.slice().sort((a,b)=>a.rank-b.rank);
  const next = list[list.findIndex(x=>x.slug===p.slug)+1];
  const divider = `
    <div class="player-divider">
      <div class="dl"></div>
      <div class="rank-chip">NEXT · #${next.rank} ${next.name}</div>
      <div class="dl"></div>
    </div>
  `;
  return block + divider;
}

function renderRankingPage(id){
  const ranking = RANKINGS.find(r=>r.id===id);

  document.title = ranking.title + " | Arena Ten";

    <a href="#${p.slug}" class="row" style="--team:${p.color}" onclick="event.preventDefault(); document.getElementById('${p.slug}').scrollIntoView({behavior:'smooth', block:'start'});">
      <div class="rank-badge"><span>${p.rank}</span></div>
      <div class="row-name">
        <h3>${p.name}</h3>
        <div class="sub">${p.team} · ${p.pos}</div>

      <div class="grade-pill" style="--grade-color:${GRADE_COLOR(p.grades.overall)}">${p.grades.overall}</div>

  const profiles = list.map((p,i)=>renderPlayerBlock(p, ranking, i===list.length-1)).join("");

  const hmCards = ranking.honorable.map(h=>`
    <div class="hm-card" style="--team:${h.color}">

      <ul>${h.accomplishments.map(a=>`<li>${a}</li>`).join("")}</ul>
      <div class="hm-label">STORYLINE</div>
      <p>${h.storyline}</p>
      <div class="hm-label">WHY THEY DIDN'T MAKE THE CUT</div>
      <p>${h.whyNotCut}</p>
    </div>
  `).join("");

  const metaRow = ranking.metaRow.map(([label,val])=>`
    <div class="meta-item"><span class="label">${label}</span><b>${val}</b></div>
  `).join("");

  const method = ranking.method.map(([title,desc])=>`
    <div><span>${title}</span><p>${desc}</p></div>
  `).join("");

  return `
    <a href="#/rankings" class="back-to-hub">← BACK TO ALL RANKINGS</a>
    <section class="hero">
      <div class="eyebrow">✦ ${ranking.eyebrow} ✦</div>
      <h1 class="display">${ranking.heading}</h1>

      <div class="method">${method}</div>
    </section>
    <div class="list-head">
      <h2>Jump to a Player</h2>
    </div>
    <div class="list">${quickList}</div>

    <div class="list-head">
      <h2>The Full Countdown</h2>
    </div>
    ${profiles}

    <div class="hm-section">
      <div class="section-title">HONORABLE MENTIONS</div>
      <div class="hm-grid">${hmCards}</div>
    </div>
    ${SITE_FOOTER}
  `;
}

function setActiveNav(routeName){
  document.querySelectorAll(".sidebar-links a").forEach(a=>{
    a.classList.toggle("active", a.dataset.route === routeName);
  });
}

function closeMobileSidebar(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebarBackdrop").classList.remove("show");
}

function router(){
  const hash = location.hash || "#/";
  const app = document.getElementById("app");
  const rankingMatch = hash.match(/^#\/ranking\/([a-z0-9-]+)/);

  closeMobileSidebar();

  if(rankingMatch){
    app.innerHTML = renderRankingPage(rankingMatch[1]);
    setActiveNav("rankings");
    window.scrollTo({top:0, behavior:"instant"});
  } else if(hash === "#/rankings"){
    app.innerHTML = renderRankingsHub();
    setActiveNav("rankings");
    window.scrollTo({top:0, behavior:"instant"});
  } else if(hash === "#/news"){
    app.innerHTML = renderNews();
    setActiveNav("news");
    window.scrollTo({top:0, behavior:"instant"});
  } else if(hash === "#/about"){
    app.innerHTML = renderAbout();
    setActiveNav("about");
    window.scrollTo({top:0, behavior:"instant"});
  } else if(hash === "#/contact"){
    app.innerHTML = renderContact();
    setActiveNav("contact");
    window.scrollTo({top:0, behavior:"instant"});
  } else if(hash === "#/" || hash === ""){
    app.innerHTML = renderHome();
    setActiveNav("home");
    window.scrollTo({top:0, behavior:"instant"});
  }
  // any other hash (e.g. an in-page player anchor like #kairi) is left alone
  // so the browser's native anchor scroll behavior can take over.
  checkBackToTop();
}
window.addEventListener("hashchange", router);

function checkBackToTop(){
  const btn = document.getElementById("backToTop");
  if(!btn) return;
  const listEl = document.querySelector(".list");
  let show;
  if(listEl){
    // Show once the quick-list (top 10 jump list) has fully scrolled past,
    // i.e. we've entered the individual player profiles.
    show = listEl.getBoundingClientRect().bottom < 0;
  } else {
    show = window.scrollY > 700;
  }
  btn.classList.toggle("show", show);
}

function toggleSidebar(){
  const sidebar = document.getElementById("sidebar");
  const backdrop = document.getElementById("sidebarBackdrop");
  const edgeToggle = document.getElementById("sidebarEdgeToggle");
  if(window.innerWidth <= 900){
    sidebar.classList.toggle("open");
    backdrop.classList.toggle("show");
  } else {
    const collapsed = document.body.classList.toggle("sidebar-collapsed");
    if(edgeToggle) edgeToggle.textContent = collapsed ? "▸" : "◂";
    try{ localStorage.setItem("arenaTenSidebarCollapsed", collapsed ? "1" : "0"); }catch(e){}
  }
}

window.addEventListener("DOMContentLoaded", () => {
  router();
  const menuBtn = document.getElementById("menuBtn");
  const sidebar = document.getElementById("sidebar");
  const backdrop = document.getElementById("sidebarBackdrop");
  const edgeToggle = document.getElementById("sidebarEdgeToggle");
  const backToTop = document.getElementById("backToTop");

  if(menuBtn) menuBtn.addEventListener("click", toggleSidebar);
  if(edgeToggle) edgeToggle.addEventListener("click", toggleSidebar);
  if(backdrop) backdrop.addEventListener("click", closeMobileSidebar);

  // Restore the user's desktop sidebar preference across visits.
  try{
    if(window.innerWidth > 900 && localStorage.getItem("arenaTenSidebarCollapsed") === "1"){
      document.body.classList.add("sidebar-collapsed");
      if(edgeToggle) edgeToggle.textContent = "▸";
    }
  }catch(e){}

  if(backToTop){
    backToTop.addEventListener("click", () => {
      window.scrollTo({top:0, behavior:"smooth"});
    });
  }
  window.addEventListener("scroll", checkBackToTop, {passive:true});
  checkBackToTop();
});
</script>
</body>
</html>
